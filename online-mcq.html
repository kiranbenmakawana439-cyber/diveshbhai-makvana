<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Exam</title>

<link rel="stylesheet" href="style.css">

<style>
.exam-box{
    max-width:800px;
    margin:30px auto;
    padding:25px;
    background:white;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.question{
    margin:25px 0;
    padding:15px;
    background:#f5f5f5;
    border-radius:10px;
}

.option{
    display:block;
    margin:10px 0;
}

#timer{
    font-size:28px;
    font-weight:bold;
    text-align:center;
}
</style>

</head>

<body>

<header>
<h1>📝 Online MCQ Exam</h1>
<p>12th Commerce Study Hub</p>
</header>

<div class="exam-box">

<h2 id="timer">⏰ 05:00</h2>

<div class="question">

<h3>1. What is Accountancy?</h3>

<label class="option">
<input type="radio" name="q1" value="a">
Recording financial transactions
</label>

<label class="option">
<input type="radio" name="q1" value="b">
Playing games
</label>

<label class="option">
<input type="radio" name="q1" value="c">
Drawing pictures
</label>

</div>


<div class="question">

<h3>2. Economics mainly studies?</h3>

<label class="option">
<input type="radio" name="q2" value="a">
Resources and their use
</label>

<label class="option">
<input type="radio" name="q2" value="b">
Movies
</label>

<label class="option">
<input type="radio" name="q2" value="c">
Sports
</label>

</div>


<div class="question">

<h3>3. Which is a financial statement?</h3>

<label class="option">
<input type="radio" name="q3" value="a">
Balance Sheet
</label>

<label class="option">
<input type="radio" name="q3" value="b">
Timetable
</label>

<label class="option">
<input type="radio" name="q3" value="c">
Calendar
</label>

</div>

<button onclick="submitExam()">
✅ Submit Exam
</button>

<h2 id="result"></h2>

</div>

<script>

let time = 300;
let submitted = false;

const timer = setInterval(function(){

    if(time <= 0){

        clearInterval(timer);

        submitExam();

        return;
    }

    let minutes =
        Math.floor(time / 60);

    let seconds =
        time % 60;

    document.getElementById("timer")
    .innerHTML =
        "⏰ " +
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");

    time--;

},1000);


function submitExam(){

    if(submitted) return;

    submitted = true;

    clearInterval(timer);

    let score = 0;

    if(
        document.querySelector(
            'input[name="q1"]:checked'
        )?.value === "a"
    ){
        score++;
    }

    if(
        document.querySelector(
            'input[name="q2"]:checked'
        )?.value === "a"
    ){
        score++;
    }

    if(
        document.querySelector(
            'input[name="q3"]:checked'
        )?.value === "a"
    ){
        score++;
    }

    let percentage =
        Math.round((score / 3) * 100);

    document.getElementById("result")
    .innerHTML =
        "🎉 Result: " +
        score +
        "/3 (" +
        percentage +
        "%)";

}

</script>

</body>
</html>
